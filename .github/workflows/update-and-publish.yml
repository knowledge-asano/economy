name: Update data and publish slides

on:
  push:
    branches: [main]
    paths-ignore: ['README.md']
  schedule:
    # UTC. Japan time: 06:23 and 17:23. Runs can be delayed by GitHub.
    - cron: '23 21 * * *'
    - cron: '23 8 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: economy-slides-publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Check parsing and data integrity
        run: python -m unittest discover -s tests -v
      - name: Collect official observations
        id: collect
        continue-on-error: true
        run: python scripts/update_data.py
      - name: Preserve the last valid dataset
        run: |
          python scripts/check_data.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/latest.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update dated economic observations'
            git push
          fi
      - uses: actions/configure-pages@v5
      - name: Prepare public files
        run: |
          mkdir -p _site/data
          cp index.html _site/index.html
          cp data/latest.json _site/data/latest.json
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
